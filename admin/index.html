<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Admin – Akademia</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: #0f172a;
        color: white;
        display: flex;
        min-height: 100vh;
      }

      /* ===== Sidebar ===== */

      .sidebar {
        width: 240px;
        background: #1e293b;
        padding: 30px 20px;
        display: flex;
        flex-direction: column;
        transition: 0.3s;
      }

      .sidebar h2 {
        margin: 0 0 30px 0;
        font-size: 20px;
      }

      .menu-item {
        padding: 12px;
        margin-bottom: 8px;
        border-radius: 8px;
        cursor: pointer;
        transition: 0.2s;
        opacity: 0.8;
      }

      .menu-item:hover,
      .menu-item.active {
        background: #334155;
        opacity: 1;
      }

      .sidebar-footer {
        margin-top: auto;
      }

      .logout-btn {
        padding: 10px;
        width: 100%;
        border-radius: 8px;
        border: none;
        background: #ef4444;
        color: white;
        cursor: pointer;
      }

      /* ===== Main ===== */

      .main {
        flex: 1;
        padding: 40px;
        width: 100%;
      }

      .header {
        font-size: 22px;
        margin-bottom: 30px;
      }

      .card {
        background: #1e293b;
        padding: 30px;
        border-radius: 16px;
        max-width: 500px;
        width: 100%;
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4);
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 8px;
        border: none;
        background: #334155;
        color: white;
      }

      button.primary {
        width: 100%;
        padding: 12px;
        border-radius: 8px;
        border: none;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        cursor: pointer;
      }

      /* ===== Mobile ===== */

      .menu-toggle {
        display: none;
        position: absolute;
        top: 15px;
        left: 15px;
        font-size: 22px;
        cursor: pointer;
      }

      @media (max-width: 768px) {
        body {
          flex-direction: column;
        }

        .sidebar {
          position: fixed;
          left: -260px;
          top: 0;
          height: 100%;
          z-index: 1000;
        }

        .sidebar.open {
          left: 0;
        }

        .menu-toggle {
          display: block;
        }

        .main {
          padding: 70px 20px 20px 20px;
        }

        .card {
          margin: 0 auto;
        }
      }
      .overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.35); 
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s ease;
        z-index: 999;
      }

      .overlay.active {
        opacity: 1;
        pointer-events: all;
      }
      .user-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px;
        border-bottom: 1px solid #334155;
      }

      .user-info {
        display: flex;
        flex-direction: column;
      }

      .user-role {
        font-size: 12px;
        opacity: 0.7;
      }

      .delete-btn {
        background: #ef4444;
        border: none;
        padding: 6px 10px;
        border-radius: 6px;
        cursor: pointer;
        color: white;
      }
      .password-wrapper {
        position: relative;
        display: flex;
        align-items: center;
      }

      .password-wrapper input {
        padding-right: 40px;
      }

      .toggle-password {
        position: absolute;
        right: 14px;
        height: 100%;
        display: flex;
        align-items: center;
        cursor: pointer;
        opacity: 0.7;
        user-select: none;
      }

      .toggle-password:hover {
        opacity: 1;
      }
    </style>
  </head>

  <body>
    <div class="menu-toggle" onclick="toggleMenu()">☰</div>
    <div class="sidebar">
      <h2>AKADEMIA</h2>

      <div class="menu-item active">Create User</div>
      <div class="menu-item">Manage Users</div>
      <div class="menu-item">Settings</div>

      <div class="sidebar-footer">
        <button id="logout" class="logout-btn">Logout</button>
      </div>
    </div>
    <div class="overlay" onclick="toggleMenu()"></div>

    <div class="main">
      <div class="header">Admin Dashboard</div>

      <div class="card" id="createUserSection">
        <h3>Create User</h3>

        <form autocomplete="off">
          <input id="email" placeholder="Email" autocomplete="off" />

          <div class="password-wrapper">
            <input
              id="password"
              placeholder="Password"
              type="password"
              autocomplete="new-password"
            />
            <span class="toggle-password" onclick="togglePassword()">👁</span>
          </div>

          <input id="username" placeholder="Username" autocomplete="off" />

          <select id="role">
            <option value="participant">Participant</option>
            <option value="indrumator">Indrumator</option>
            <option value="admin">Admin</option>
          </select>

          <button id="createUserBtn" class="primary">Create User</button>
        </form>

        <div id="result"></div>
      </div>

      <div class="card" id="manageUsersSection" style="display: none">
        <h3>Manage Users</h3>
        <div id="usersList"></div>
      </div>
    </div>

    <script type="module">
      const supabase = window.supabase.createClient(
        "https://pdkfqytododevpilpxet.supabase.co",
        "sb_publishable_9SE72Dov4XTRfAGoXhL1Nw_kbdPfK4z",
      );

      async function init() {
        const {
          data: { session },
        } = await supabase.auth.getSession();

        if (!session) {
          window.location.href = "/login.html";
          return;
        }

        const username = session.user.user_metadata?.username;

        const { data: account } = await supabase
          .from("accounts")
          .select("role")
          .eq("username", username)
          .single();

        if (!account || account.role !== "admin") {
          await supabase.auth.signOut();
          window.location.href = "/login.html";
          return;
        }

        document.getElementById("logout").onclick = async () => {
          await supabase.auth.signOut();
          window.location.href = "/login.html";
        };

        document
          .getElementById("createUserBtn")
          .addEventListener("click", createUser);

        document.querySelectorAll(".menu-item").forEach((item) => {
          item.addEventListener("click", function () {
            if (window.innerWidth <= 768) {
              toggleMenu();
            }

            document
              .querySelectorAll(".menu-item")
              .forEach((i) => i.classList.remove("active"));

            this.classList.add("active");

            const text = this.innerText;

            document.getElementById("createUserSection").style.display =
              text === "Create User" ? "block" : "none";

            document.getElementById("manageUsersSection").style.display =
              text === "Manage Users" ? "block" : "none";

            if (text === "Manage Users") {
              loadUsers();
            }
          });
        });
      }

      async function createUser() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const username = document.getElementById("username").value;
        const role = document.getElementById("role").value;

        const res = await fetch("/.netlify/functions/create-user", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password, username, role }),
        });

        const data = await res.json();

        if (res.ok) {
          document.getElementById("result").innerText = "User creat!";
        } else {
          document.getElementById("result").innerText = data.error;
        }
      }
      async function loadUsers() {
        const { data, error } = await supabase
          .from("accounts")
          .select("id, username, role");

        if (error) {
          console.error(error);
          return;
        }

        const container = document.getElementById("usersList");
        container.innerHTML = "";

        data.forEach((user) => {
          const row = document.createElement("div");
          row.className = "user-row";

          row.innerHTML = `
      <div class="user-info">
        <strong>${user.username}</strong>
        <span class="user-role">${user.role}</span>
      </div>
      <button class="delete-btn" onclick="deleteUser('${user.id}')">Delete</button>
    `;

          container.appendChild(row);
        });
      }

   
      window.toggleMenu = function () {
        const sidebar = document.querySelector(".sidebar");
        const overlay = document.querySelector(".overlay");

        sidebar.classList.toggle("open");
        overlay.classList.toggle("active");
      };
      window.deleteUser = async function (id) {
        if (!confirm("Sigur vrei să ștergi userul?")) return;

        const res = await fetch("/.netlify/functions/delete-user", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ userId: id }),
        });

        if (res.ok) {
          loadUsers();
        } else {
          alert("Eroare la ștergere");
        }
      };
      window.togglePassword = function () {
        const passwordInput = document.getElementById("password");

        if (passwordInput.type === "password") {
          passwordInput.type = "text";
        } else {
          passwordInput.type = "password";
        }
      };

      init();
    </script>
  </body>
</html>
