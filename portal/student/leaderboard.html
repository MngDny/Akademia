<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Student - Clasament</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/portal/student/student.css" />
  </head>

  <body>
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main">
        <div class="main-content">
          <div class="page-header">
            <div>
              <p class="title-eyebrow">Portal student</p>
              <h1 class="header">Clasament</h1>
              <p id="leaderboardSubtitle" role="status" class="page-help">Se încarcă clasamentul...</p>
            </div>
          </div>

          <section class="card leaderboard-card leaderboard-page-card" aria-labelledby="leaderboardTitle">
            <div class="section-head compact-section-head">
              <h2 id="leaderboardTitle">Clasament</h2>
              <span id="leaderboardUpdated" class="muted">-</span>
            </div>
            <div class="leaderboard-toolbar" aria-label="Filtre clasament">
              <div class="leaderboard-filter">
                <label class="label" for="leaderboardMetric">Sortează după</label>
                <select id="leaderboardMetric" class="input">
                  <option value="points">Puncte</option>
                  <option value="tests">Număr de teste</option>
                </select>
              </div>
              <div class="leaderboard-filter">
                <label class="label" for="leaderboardPeriod">Perioada</label>
                <select id="leaderboardPeriod" class="input">
                  <option value="today">Astăzi</option>
                  <option value="week">Săptămâna curentă</option>
                  <option value="month">Luna curentă</option>
                  <option value="year" selected>Anul curent</option>
                  <option value="all">Total</option>
                </select>
              </div>
            </div>
            <div id="leaderboard" class="leaderboard-list muted">Se încarcă...</div>
          </section>
        </div>
      </main>
    </div>

    <script type="module" src="/assets/js/modules/student/navigation.js"></script>
    <script type="module" src="/assets/js/modules/student/leaderboard.js"></script>
  </body>
</html>
