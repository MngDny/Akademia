<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Student - Rezultate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/portal/student/student.css" />
  </head>

  <body>
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main">
        <div class="main-content">
          <div class="page-header">
            <div>
              <p class="title-eyebrow">Talantul în negoț</p>
              <h1 class="header">Istoric rezultate</h1>
              <p id="resultsSubtitle" role="status" class="page-help">Se încarcă rezultatele tale…</p>
            </div>
          </div>

          <div class="card" style="max-width: 100%;">
            <div class="table-header" style="display:flex; justify-content:space-between; gap:10px; margin-bottom:10px;">
              <input id="searchInput" type="search" aria-label="Caută în listă" class="input" placeholder="Caută după dată sau punctaj…" autocomplete="off" style="margin:0;" />
              <label class="sr-only" for="bookFilter">Filtrează după carte</label>
              <input id="bookFilter" class="input" type="search" placeholder="Toate cărțile" aria-label="Filtrează rezultatele după carte" autocomplete="off" />
              <a class="btn primary" href="/portal/student/quiz.html">Începe un test nou</a>
            </div>

            <div class="table-wrapper" tabindex="0" role="region" aria-label="Tabel cu rezultate">
              <table class="table">
                <thead>
                  <tr>
                    <th scope="col">Data</th>
                    <th scope="col">Puncte</th>
                    <th scope="col">Corecte</th>
                    <th scope="col">Durată</th>
                    <th scope="col">Detalii</th>
                  </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
              </table>
            </div>

            <div id="emptyState" class="empty-state" style="display:none;">
              Rezultatele tale vor apărea aici după primul test.
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/assets/js/modules/student/navigation.js"></script>
    <script type="module" src="/assets/js/modules/student/results.js"></script>
  </body>
</html>
