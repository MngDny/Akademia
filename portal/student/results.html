<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Student - Rezultate</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/portal/student/student.css" />
  </head>

  <body>
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>

      <main class="main">
        <div class="main-content">
          <div class="page-header">
            <div>
              <p class="title-eyebrow">Concurs Biblic Talantul in Negot</p>
              <h1 class="header">Istoric rezultate</h1>
              <p id="resultsSubtitle" class="page-help">Se incarca rezultatele...</p>
            </div>
          </div>

          <div class="card" style="max-width: 100%;">
            <div class="table-header" style="display:flex; justify-content:space-between; gap:10px; margin-bottom:10px;">
              <input id="searchInput" class="input" placeholder="Cautare dupa tip/mod..." autocomplete="off" style="margin:0;" />
              <button id="clearBtn" class="btn danger">Sterge istoric</button>
            </div>

            <div class="table-wrapper">
              <table class="table">
                <thead>
                  <tr>
                    <th>Data</th>
                    <th>Mod</th>
                    <th>Tip</th>
                    <th>Punctaj</th>
                    <th>Durata</th>
                  </tr>
                </thead>
                <tbody id="resultsBody"></tbody>
              </table>
            </div>

            <div id="emptyState" class="empty-state" style="display:none;">
              Nu ai rezultate salvate inca.
            </div>
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/assets/js/modules/student/navigation.js"></script>
    <script type="module" src="/assets/js/modules/student/results.js"></script>
  </body>
</html>
