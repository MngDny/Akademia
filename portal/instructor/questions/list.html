<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Îndrumător - Întrebări</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <!-- Global shared styles -->
    <link rel="stylesheet" href="/assets/css/layout.css" />
    <link rel="stylesheet" href="/assets/css/components.css" />
    <link rel="stylesheet" href="/portal/instructor/instructor.css" />

    <!-- Page styles -->
    <link rel="stylesheet" href="/portal/instructor/questions/list.css" />
  </head>

  <body>
    <div class="layout">
      <aside class="sidebar" id="sidebar"></aside>

      <!-- Main -->
      <main class="main">
        <div class="quick-links"><a class="quick-link" href="/portal/instructor/dashboard.html">← Privire de ansamblu</a></div>

        <div class="page-header">
          <div>
            <p class="title-eyebrow">Spațiu de lucru îndrumător</p>
            <h1 id="pageTitle" class="header">Întrebări</h1>
            <p id="pageSubtitle" class="muted"></p>
          </div>

          <div class="header-actions">
            <a id="addBtn" class="btn primary" href="#">Adaugă întrebare</a>
          </div>
        </div>

        <div class="card">
          <div class="table-header">
            <input id="searchInput" type="search" aria-label="Caută în listă" class="input" placeholder="Caută întrebări..." autocomplete="off" />
            <label class="sr-only" for="bookFilter">Filtrează după carte</label>
            <input id="bookFilter" class="input" type="search" placeholder="Toate cărțile" aria-label="Filtrează după carte" autocomplete="off" />
          </div>

          <div class="table-wrapper" tabindex="0" role="region" aria-label="Tabel cu rezultate">
            <table class="table">
              <thead>
                <tr>
                  <th scope="col" style="width: 120px;">ID</th>
                  <th scope="col">Întrebare</th>
                  <th scope="col" style="width: 220px;">Acțiuni</th>
                </tr>
              </thead>
              <tbody id="tableBody"></tbody>
            </table>
          </div>

          <div id="emptyState" class="empty-state" style="display:none;">
            Nu există întrebări pentru această categorie.
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="/assets/js/modules/instructor/navigation.js"></script>
    <script type="module" src="/assets/js/modules/instructor/questions/listQuestions.js"></script>
  </body>
</html>
