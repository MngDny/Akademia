<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Akademia - Înregistrare Student</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="/login.css" />
  </head>

  <body>
    <div class="login-card">
      <h1>AKADEMIA</h1>
      <div class="subtitle">Înregistrare cont student</div>

      <input id="username" type="text" placeholder="Nume utilizator (3-24, litere mici/cifre)" />
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Parolă (minim 10 caractere)" />
      <input id="confirmPassword" type="password" placeholder="Confirmă parola" />

      <button id="registerBtn">
        <span id="btnText">Creează cont student</span>
        <span id="spinner" class="spinner hidden"></span>
      </button>

      <div id="error" class="error"></div>
      <div id="success" class="success"></div>

      <a href="/login.html" class="auth-link">Ai deja cont? Autentifică-te</a>
      <a href="/" class="back">← Înapoi la pagina principală</a>
    </div>

    <script type="module" src="/assets/js/modules/auth/register.js"></script>
  </body>
</html>
