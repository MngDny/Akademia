<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Akademia – Autentificare</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: radial-gradient(circle at top, #1e293b, #0f172a);
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 20px;
        color: white;
      }

      .login-card {
        background: #1e293b;
        width: 100%;
        max-width: 420px;
        padding: 40px 30px;
        border-radius: 16px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        text-align: center;
      }

      .login-card h1 {
        margin: 0;
        font-size: 32px;
        letter-spacing: 2px;
      }

      .subtitle {
        margin-top: 8px;
        margin-bottom: 35px;
        font-size: 14px;
        opacity: 0.7;
      }

      input {
        width: 100%;
        padding: 14px;
        margin-bottom: 18px;
        border-radius: 8px;
        border: none;
        outline: none;
        font-size: 14px;
        background: #334155;
        color: white;
        transition: 0.2s;
      }

      input:focus {
        background: #3b4a63;
        box-shadow: 0 0 0 2px #6366f1;
      }

      button {
        width: 100%;
        padding: 14px;
        border-radius: 8px;
        border: none;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        transition: 0.3s;
      }

      button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4);
      }

      .error {
        margin-top: 15px;
        font-size: 13px;
        color: #f87171;
        min-height: 18px;
      }

      .back {
        margin-top: 25px;
        font-size: 13px;
        opacity: 0.6;
        text-decoration: none;
        color: white;
        display: inline-block;
        transition: 0.2s;
      }

      .back:hover {
        opacity: 1;
      }

      @media (max-width: 480px) {
        .login-card {
          padding: 30px 20px;
        }

        .login-card h1 {
          font-size: 26px;
        }
      }
      button {
        width: 100%;
        padding: 14px;
        border-radius: 8px;
        border: none;
        font-size: 15px;
        font-weight: 500;
        cursor: pointer;
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        color: white;
        transition: 0.3s;
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
      }

      button:disabled {
        opacity: 0.7;
        cursor: not-allowed;
      }

      .spinner {
        width: 18px;
        height: 18px;
        border: 3px solid rgba(255, 255, 255, 0.3);
        border-top: 3px solid white;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      .hidden {
        display: none;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div class="login-card">
      <h1>AKADEMIA</h1>
      <div class="subtitle">Autentificare în platformă</div>

      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Parolă" />

      <button id="loginBtn">
        <span id="btnText">Autentificare</span>
        <span id="spinner" class="spinner hidden"></span>
      </button>

      <div id="error" class="error"></div>

      <a href="/" class="back">← Înapoi la pagina principală</a>
    </div>

    <script type="module">
      const supabase = window.supabase.createClient(
        "https://pdkfqytododevpilpxet.supabase.co",
        "sb_publishable_9SE72Dov4XTRfAGoXhL1Nw_kbdPfK4z",
      );

      const errorEl = document.getElementById("error");

      document.getElementById("loginBtn").addEventListener("click", login);

      async function login() {
        errorEl.innerText = "";

        const button = document.getElementById("loginBtn");
        const btnText = document.getElementById("btnText");
        const spinner = document.getElementById("spinner");

        // 🔄 Activăm loading
        button.disabled = true;
        btnText.innerText = "Se autentifică...";
        spinner.classList.remove("hidden");

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        const { data, error } = await supabase.auth.signInWithPassword({
          email,
          password,
        });

        if (error) {
          errorEl.innerText = "Email sau parolă incorectă.";

          // 🔁 Reset button
          button.disabled = false;
          btnText.innerText = "Autentificare";
          spinner.classList.add("hidden");
          return;
        }

        const user = data.user;
        const username = user.user_metadata?.username;

        if (!username) {
          errorEl.innerText = "Profil invalid.";

          button.disabled = false;
          btnText.innerText = "Autentificare";
          spinner.classList.add("hidden");
          return;
        }

        const { data: account } = await supabase
          .from("accounts")
          .select("role")
          .eq("username", username)
          .single();

        if (!account) {
          errorEl.innerText = "Contul nu este configurat.";

          button.disabled = false;
          btnText.innerText = "Autentificare";
          spinner.classList.add("hidden");
          return;
        }

        // 🚀 Redirect
        if (account.role === "admin") {
          window.location.href = "/admin/index.html";
        } else if (account.role === "indrumator") {
          window.location.href = "/indrumator/index.html";
        } else {
          window.location.href = "/participant/index.html";
        }
      }
    </script>
  </body>
</html>
