<!doctype html>
<html lang="ro">
  <head>
    <meta charset="UTF-8" />
    <title>Akademia - Resetare parolă</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />

    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <link rel="stylesheet" href="/login.css" />
  </head>

  <body>
    <div class="login-card">
      <h1>AKADEMIA</h1>
      <div class="subtitle">Setează parola nouă</div>

      <div class="password-wrapper">
        <input id="newPassword" type="password" placeholder="Parolă nouă (minim 10 caractere)" />
        <button class="toggle-password" type="button" aria-label="Arată parola">👁</button>
      </div>
      <div class="password-wrapper">
        <input id="confirmNewPassword" type="password" placeholder="Confirmă parola nouă" />
        <button class="toggle-password" type="button" aria-label="Arată parola">👁</button>
      </div>

      <button id="resetBtn">
        <span id="btnText">Actualizează parola</span>
        <span id="spinner" class="spinner hidden"></span>
      </button>

      <div id="error" class="error"></div>
      <div id="success" class="success"></div>

      <a href="/login.html" class="auth-link">Înapoi la autentificare</a>
      <a href="/" class="back">← Înapoi la pagina principală</a>
    </div>

    <script type="module" src="/assets/js/modules/auth/resetPassword.js"></script>
  </body>
</html>
