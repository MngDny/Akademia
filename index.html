<!doctype html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <title>Akademia</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 600px;
    }

    h1 {
      font-size: 48px;
      margin-bottom: 10px;
      letter-spacing: 2px;
    }

    p {
      font-size: 18px;
      opacity: 0.8;
      margin-bottom: 40px;
    }

    .btn {
      background: #6366f1;
      padding: 15px 30px;
      border-radius: 8px;
      text-decoration: none;
      color: white;
      font-size: 16px;
      transition: 0.3s;
      display: inline-block;
    }

    .btn:hover {
      background: #4f46e5;
      transform: translateY(-2px);
    }

    .footer {
      position: absolute;
      bottom: 20px;
      width: 100%;
      font-size: 14px;
      opacity: 0.5;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>AKADEMIA</h1>
    <p>Platformă de testare biblică<br>
       Testează-ți cunoștințele biblice.</p>

    <a href="/login.html" class="btn">Intră în platformă</a>
  </div>

  <div class="footer">
    © 2026 Akademia
  </div>

</body>
</html>
